name: Build and Publish Docker image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Scalar registry
      uses: docker/login-action@v2
      with:
        registry: registry.scalar.com
        username: ${{ secrets.SCALAR_REGISTRY_USERNAME }}
        password: ${{ secrets.SCALAR_REGISTRY_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        push: true
        tags: |
          registry.scalar.com/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          registry.scalar.com/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}

    # Optional: Publish OpenAPI spec to Scalar registry API (requires SCALAR_API_TOKEN)
