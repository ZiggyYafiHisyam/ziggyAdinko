name: Build and Publish Docker image

on:
  push:
    branches: [ main ]

jobs:
  publish-api:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Publish OpenAPI to Scalar
      env:
        SCALAR_API_TOKEN: ${{ secrets.SCALAR_API_TOKEN }}
      run: |
        if [ -z "${SCALAR_API_TOKEN}" ]; then
          echo "SCALAR_API_TOKEN not set; skipping OpenAPI publish."
          exit 0
        fi
        echo "Publishing openapi.yaml to Scalar registry..."
        curl -v -X POST \
          -H "Authorization: Bearer $SCALAR_API_TOKEN" \
          -F "file=@openapi.yaml" \
          "https://registry.scalar.com/api/publish"
